<!DOCTYPE html>
<html>
<head>
    <title>Player Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 25px;
        }

        form {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 6px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 22px;
            margin: 10px 5px;
            font-size: 16px;
            border: 1px solid #777;
            border-radius: 8px;
            background-color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #ddd;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>College Sports Management System</h1>

    <h2>Player Registration</h2>

    <form method="POST" action="/register">

        <input type="text"
               name="player_name"
               placeholder="Player Name"
               required>

        <input type="text"
               name="register_number"
               placeholder="Register Number"
               required>

        <input type="text"
               name="department"
               placeholder="Department"
               required>

        <input type="text"
               name="year"
               placeholder="Year"
               required>

        <input type="text"
               name="sport"
               placeholder="Sport"
               required>

        <br>

        <button type="submit">Register Player</button>

    </form>

    <br>

    <a href="/">
        <button type="button">Back to Home</button>
    </a>

</body>
</html>
