<!DOCTYPE html>
<html>
<head>
    <title>Team List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 30px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            min-width: 700px;
        }

        th {
            background-color: #d9eaff;
            font-size: 17px;
        }

        th, td {
            border: 1px solid #777;
            padding: 12px 18px;
        }

        tr:hover {
            background-color: #f2f2f2;
        }

        button {
            padding: 12px 22px;
            margin: 8px 5px;
            font-size: 16px;
            border: 1px solid #777;
            border-radius: 8px;
            background-color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #ddd;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>Registered Teams</h1>

    {% if teams %}

    <table>
        <tr>
            <th>ID</th>
            <th>Team Name</th>
            <th>Sport Name</th>
            <th>Captain Name</th>
            <th>Players Count</th>
            <th>Action</th>
        </tr>

        {% for team in teams %}
        <tr>
            <td>{{ team[0] }}</td>
            <td>{{ team[1] }}</td>
            <td>{{ team[2] }}</td>
            <td>{{ team[3] }}</td>
            <td>{{ team[4] }}</td>
            <td>
                <a href="/edit-team/{{ team[0] }}">Edit</a>
                |
                <a href="/delete-team/{{ team[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}

    </table>

    {% else %}

    <p>No teams registered yet.</p>

    {% endif %}

    <br>

    <a href="/teams">
        <button type="button">Add Team</button>
    </a>

    <a href="/">
        <button type="button">Back to Home</button>
    </a>

</body>
</html>
