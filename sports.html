<!DOCTYPE html>
<html>
<head>
    <title>Sports Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 25px;
        }

        form {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
        }

        label {
            font-size: 16px;
            font-weight: bold;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 22px;
            margin: 10px 5px;
            font-size: 16px;
            border: 1px solid #777;
            border-radius: 8px;
            background-color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #ddd;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>College Sports Management System</h1>

    <h2>Sports Management</h2>

    <form method="POST" action="/add-sport">

        <label>Sport Name</label><br>
        <input type="text"
               name="sport_name"
               placeholder="Enter sport name"
               required>

        <br>

        <label>Coach Name</label><br>
        <input type="text"
               name="coach_name"
               placeholder="Enter coach name"
               required>

        <br>

        <label>Number of Players</label><br>
        <input type="number"
               name="players_count"
               placeholder="Enter number of players"
               required>

        <br>

        <button type="submit">Add Sport</button>

    </form>

    <br>

    <a href="/">
        <button type="button">Back to Home</button>
    </a>

</body>
</html>
